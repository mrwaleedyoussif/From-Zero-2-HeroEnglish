# Nightly database backup (SPEC §12): pg_dump → gzip → Drive LinguaPath/06_Backups/db (keep 30).
# Needs repository settings: Variables → APP_URL · Secrets → SUPABASE_DB_URL, NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, ENCRYPTION_KEY, CRON_SECRET,
# GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET (the Owner's Drive connection is read from the DB).
name: Nightly backup

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: pg_dump (Postgres 17 client, same major version as Supabase)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # pipefail: a failed pg_dump must fail the job, or gzip uploads an empty "backup".
        run: |
          set -euo pipefail
          file="db-$(date -u +%Y-%m-%d).sql.gz"
          docker run --rm postgres:17 pg_dump --no-owner --no-privileges "$SUPABASE_DB_URL" | gzip -9 > "$file"
          gzip -t "$file"
          test "$(stat -c %s "$file")" -gt 10000
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
      - run: npm run backup:upload -- "$BACKUP_FILE"
